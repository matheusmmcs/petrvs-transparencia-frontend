name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: "False = verificar versão / True = construir e enviar"
        required: true
        default: "false"

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Obter versão do package.json
        id: extract_version
        run: |
          VERSION=$(jq -r '.version' package.json)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Versão detectada: $VERSION"

  build-and-push:
    needs: get-version
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm_version == 'true'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construir e enviar a imagem Docker
        run: |
          VERSION=${{ needs.get-version.outputs.version }}
          # Garante que o nome da imagem esteja em minúsculas (exigência do GHCR)
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_NAME="ghcr.io/${REPO_LOWER}:${VERSION}"

          echo "Imagem = $IMAGE_NAME"
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME
